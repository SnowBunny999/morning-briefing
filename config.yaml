# ============================================================
# 每日财经早报配置（2026-11-09 按「只收投资相关 + 每条要有完整概括」重配）
# 改动信源只改这个文件；密钥不要写在这里（用 .env / GitHub Secrets）
# ============================================================

# 采集窗口：覆盖隔夜欧美时段 + 国内前一交易日；低频官方源可单独放宽
time_window_hours: 36

# 交给写稿层的最大候选条数（先筛后发，取太多只会拖慢）
max_items: 140

# 信源列表
#   region: global=海外市场 / cn=国内与 A股
#   type: 省略=RSS；json=JSON API（需 items_path 等字段）
#   window_hours: 可选，覆盖全局窗口（低频官方源用）
#   body_field: 可选，完整正文字段；title_from_body: 快讯没有标题时从正文首句取
#   单个源失效自动跳过，不影响整份早报
sources:
  # ---------- 国际：市场 / 宏观 / 科技（实测 RSS 可用，正文可抓原文） ----------
  - name: "CNBC Markets"
    region: "global"
    window_hours: 48
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664"
  - name: "CNBC Economy"
    region: "global"
    window_hours: 48
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"
  - name: "CNBC Tech"
    region: "global"
    window_hours: 48
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=19854910"
  - name: "MarketWatch MarketPulse"
    region: "global"
    window_hours: 48
    url: "https://feeds.marketwatch.com/marketwatch/marketpulse/"
  - name: "MarketWatch Realtime"
    region: "global"
    window_hours: 48
    url: "https://feeds.marketwatch.com/marketwatch/realtimeheadlines/"
  - name: "Cointelegraph"
    region: "global"
    window_hours: 48
    url: "https://cointelegraph.com/rss"
  # 美联储官方稿：政策一手源，发稿频率低，单独放宽到 96 小时
  - name: "美联储"
    region: "global"
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    window_hours: 96

  # ---------- 国内：华尔街见闻快讯（中文正文完整，实测稳定） ----------
  - name: "华尔街见闻-全球快讯"
    region: "cn"
    type: "json"
    url: "https://api-one.wallstcn.com/apiv1/content/lives?channel=global-channel&client=pc&limit=40"
    items_path: "data.items"
    title_field: "title"
    summary_field: "content_text"
    body_field: "content_text"
    link_field: "uri"
    time_field: "display_time"
    title_from_body: true
  - name: "华尔街见闻-A股快讯"
    region: "cn"
    type: "json"
    url: "https://api-one.wallstcn.com/apiv1/content/lives?channel=a-stock-channel&client=pc&limit=40"
    items_path: "data.items"
    title_field: "title"
    summary_field: "content_text"
    body_field: "content_text"
    link_field: "uri"
    time_field: "display_time"
    title_from_body: true

  # 券商/机构实时资讯（含正文，作为 A股/个股补充；写稿层限制单源条数防刷屏）
  - name: "长城证券-实时资讯"
    region: "cn"
    type: "json"
    url: "https://fintechapp.cgws.com/api/business-news/app/a/news/collection/latest/list?lastNewsId=0"
    items_path: "data"
    title_field: "title"
    summary_field: "content"
    body_field: "content"
    link_field: "jumpUrl"
    time_field: "time"
    time_format: "%Y年%m月%d日 %H:%M"
    headers:
      appPlatform: "android"
      appVerName: "1.0.0"
      Content-Type: "application/json; charset=utf-8"

  # 财联社电报：用户点名认可，但公开接口有反爬（返回「小财正在加载中」），
  # 属尽力而为；抓不到时自动跳过，不影响出稿。
  - name: "财联社-电报"
    region: "cn"
    type: "json"
    url: "https://www.cls.cn/api/v1/telegraph?page=1&rn=20"
    items_path: "data"
    title_field: "content"
    summary_field: "content"
    body_field: "content"
    title_from_body: true
    time_field: "time"
    time_format: "%Y-%m-%d %H:%M:%S"
    headers:
      Referer: "https://www.cls.cn/telegraph"
      X-Requested-With: "XMLHttpRequest"

# 说明：
# - 已实测移除：新浪滚动（社会/软新闻多）、Investing / Yahoo（403）、AP（综合时事）、
#   华尔街见闻 / 证券时报 / 财新 的旧 RSS（404 或返回网页 HTML）、金十（502）。
# - 写稿层 editorial.py 有硬门槛：只收能挂到 A股/美股/股价/市值/汇率/黄金/利率/
#   币价/政策/大科技公司财报的新闻；国际时事、教程、营销标题、概念宣传一律剔除。
# - 每条必须有「不点原文也能读懂」的 2-3 句概括，概括不出来就不入选，不硬凑。
